name: Build Android APK and AAB
on:
  workflow_dispatch:
  push:
    branches: [codex/datvip-cam-verified-integration]
    paths: ["android/**", ".github/workflows/build-android.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test and build release APK and AAB
        working-directory: android
        run: gradle testDebugUnitTest lintRelease assembleRelease assemblePreview bundleRelease --stacktrace
      - name: Upload unsigned release outputs for local signing
        uses: actions/upload-artifact@v4
        with:
          name: DatvipCam-Android-release-unsigned
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/preview/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Upload Android validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DatvipCam-Android-validation
          path: |
            android/app/build/reports
            android/app/build/test-results
