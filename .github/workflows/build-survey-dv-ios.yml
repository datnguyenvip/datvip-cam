
name: Build Survey DV signed iOS IPA

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload IPA to TestFlight
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      APP_ID: com.datnguyenvip.surveycalculatordv

    steps:
      - name: Checkout Survey Calculator DV
        uses: actions/checkout@v4
        with:
          repository: datnguyenvip/survey-calculator-dv
          ref: fix/flutter-ci-first-apk
          token: ${{ secrets.SURVEY_DV_SOURCE_TOKEN }}
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Restore iOS project
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --platforms=ios \
              --org com.datnguyenvip \
              --project-name survey_calculator_dv .
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          content = path.read_text()
          content, count = re.subn(
              r'(PRODUCT_BUNDLE_IDENTIFIER\s*=\s*)[^;]+;',
              r'\g<1>com.datnguyenvip.surveycalculatordv;',
              content,
          )
          if count == 0:
              raise SystemExit("Missing PRODUCT_BUNDLE_IDENTIFIER")
          path.write_text(content)
          PY

          flutter pub get
          flutter build ios --release --no-codesign \
            --build-name=1.0.0 --build-number=1

      - name: Install signing credentials
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.SURVEY_DV_IOS_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          : "${P12_BASE64:?Missing P12}"
          : "${P12_PASSWORD:?Missing password}"
          : "${PROFILE_BASE64:?Missing profile}"

          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          chmod 600 "$RUNNER_TEMP/sign.p12"

          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/signing.keychain-db"

          security import "$RUNNER_TEMP/sign.p12" \
            -P "$P12_PASSWORD" -t cert -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security \
            -k "$RUNNER_TEMP/signing.keychain-db"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"

          security list-keychains -d user -s \
            "$RUNNER_TEMP/signing.keychain-db" login.keychain-db

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")

          PROFILE_APP=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          test "$PROFILE_APP" = "FXQ7QLZ2HS.$APP_ID"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Archive signed iOS app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SurveyDV.xcarchive" \
            DEVELOPMENT_TEAM=FXQ7QLZ2HS \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            archive

          APP="$RUNNER_TEMP/SurveyDV.xcarchive/Products/Applications/Runner.app"
          codesign --verify --deep --strict "$APP"
          ACTUAL=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          test "$ACTUAL" = "$APP_ID"

      - name: Export signed IPA
        shell: bash
        run: |
          python3 - <<'PY'
          import os, plistlib
          settings = {
              "method": "app-store-connect",
              "teamID": "FXQ7QLZ2HS",
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "manageAppVersionAndBuildNumber": False,
              "provisioningProfiles": {
                  os.environ["APP_ID"]: os.environ["PROFILE_UUID"]
              }
          }
          with open(os.environ["RUNNER_TEMP"] + "/ExportOptions.plist", "wb") as f:
              plistlib.dump(settings, f)
          PY

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SurveyDV.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/SurveyDV-export"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SurveyCalculatorDV-iOS-Signed
          path: ${{ runner.temp }}/SurveyDV-export/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          shopt -s nullglob
          files=("$RUNNER_TEMP"/SurveyDV-export/*.ipa)
          test "${#files[@]}" -eq 1
          xcrun altool --upload-app --type ios \
            --file "${files[0]}" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Cleanup signing credentials
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/sign.p12" \
            "$RUNNER_TEMP/profile.mobileprovision" \
            "$RUNNER_TEMP/profile.plist"
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          rm -f "$HOME/.appstoreconnect/private_keys/"AuthKey_*.p8
