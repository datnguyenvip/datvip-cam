name: Upload existing Survey DV IPA to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: survey-dv-testflight-1.1.0-build3
  cancel-in-progress: false

jobs:
  upload-existing-ipa:
    runs-on: macos-15-intel
    timeout-minutes: 65
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout reviewed upload script (no app build)
        uses: actions/checkout@v4
        with:
          repository: datnguyenvip/survey-calculator-dv
          ref: 3163742abd2c367adbeba3e84bbbf39fea5ea40e
          token: ${{ secrets.SURVEY_DV_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Download the original signed IPA from unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/survey-ipa"
          gh release download survey-dv-1.1.0-build3 \
            --repo datnguyenvip/datvip-cam \
            --pattern SurveyCalculatorDV-1.1.0-build3-AppStore.ipa \
            --dir "$RUNNER_TEMP/survey-ipa"
      - name: Verify identity and signature, upload with Apple altool, monitor processing
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          set -euo pipefail
          python3 ci/testflight_upload.py \
            --ipa "$RUNNER_TEMP/survey-ipa/SurveyCalculatorDV-1.1.0-build3-AppStore.ipa" \
            --report "$RUNNER_TEMP/testflight-1.1.0-build3-status.json" \
            --wait-minutes 40
      - name: Save non-secret processing report to the unpublished draft
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/testflight-1.1.0-build3-status.json"
          if [ -f "$REPORT" ]; then
            gh release upload survey-dv-1.1.0-build3 "$REPORT" \
              --repo datnguyenvip/datvip-cam --clobber
          fi
      - name: Remove temporary API key
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          identifier = os.environ.get('ASC_KEY_ID', '')
          if identifier.isalnum():
              path = Path.home() / '.appstoreconnect/private_keys' / ('AuthKey_' + identifier + '.p8')
              path.unlink(missing_ok=True)
          PY
