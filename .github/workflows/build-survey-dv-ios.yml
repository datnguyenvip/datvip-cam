
name: Build Survey DV signed iOS IPA

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Reserved flag; this packaging branch never uploads
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      APP_ID: com.datnguyenvip.surveycalculatordv
      APP_TEAM: FXQ7QLZ2HS

    steps:
      # 1. Get Survey Calculator DV source
      - name: Checkout Survey Calculator DV
        uses: actions/checkout@v4
        with:
          repository: datnguyenvip/survey-calculator-dv
          ref: eaf40ef7774ba93029fc1465e680f7db74fd58b6
          token: ${{ secrets.SURVEY_DV_SOURCE_TOKEN }}
          persist-credentials: false

      # 2. Install Flutter
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      # 3. Restore and build Flutter iOS
      - name: Restore iOS project
        env:
          SURVEY_GOOGLE_MAPS_IOS_KEY: ${{ secrets.SURVEY_GOOGLE_MAPS_IOS_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          flutter --version
          flutter pub get

          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --platforms=ios \
              --org com.datnguyenvip \
              --project-name survey_calculator_dv .
          fi

          test -f ios/Runner.xcodeproj/project.pbxproj
          python3 ci/package_assets.py
          python3 ci/configure_features.py
          flutter analyze
          flutter test

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          content = path.read_text()

          content, count = re.subn(
              r'(PRODUCT_BUNDLE_IDENTIFIER\s*=\s*)[^;]+;',
              r'\g<1>com.datnguyenvip.surveycalculatordv;',
              content,
          )

          if count == 0:
              raise SystemExit("Missing bundle identifier")

          path.write_text(content)
          print("Bundle ID configured")
          PY

          flutter pub get

          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if "iPhone" in d["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/calculator_test.dart -d "$DEVICE"

          flutter build ios \
            --release \
            --no-codesign \
            --build-name=1.2.0 \
            --build-number=2

          echo "FLUTTER IOS BUILD SUCCESS"

      - name: Save native iOS evidence in an unpublished draft
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d build/native_ui ]; then exit 0; fi
          TAG="survey-dv-map-evidence-$GITHUB_RUN_ID"
          gh release create "$TAG" build/native_ui/*.png --repo "$GITHUB_REPOSITORY" --target build/survey-dv-1.2.0-map --draft --title 'Survey DV map validation evidence' --notes 'Unpublished screenshots from isolated simulator checks. No store upload.'

      # 4. Install signing credentials
      - name: Install Apple signing credentials
        shell: bash
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.SURVEY_DV_IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          : "${P12_BASE64:?Missing P12}"
          : "${P12_PASSWORD:?Missing P12 password}"
          : "${PROFILE_BASE64:?Missing provisioning profile}"

          printf '%s' "$P12_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/sign.p12"

          printf '%s' "$PROFILE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/profile.mobileprovision"

          chmod 600 "$RUNNER_TEMP/sign.p12"

          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$RUNNER_TEMP/signing.keychain-db"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$RUNNER_TEMP/signing.keychain-db"

          security set-keychain-settings \
            -lut 21600 \
            "$RUNNER_TEMP/signing.keychain-db"

          security import "$RUNNER_TEMP/sign.p12" \
            -P "$P12_PASSWORD" \
            -t cert \
            -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -k "$RUNNER_TEMP/signing.keychain-db"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PASSWORD" \
            "$RUNNER_TEMP/signing.keychain-db"

          security list-keychains -d user -s \
            "$RUNNER_TEMP/signing.keychain-db" \
            login.keychain-db

          security cms -D \
            -i "$RUNNER_TEMP/profile.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c 'Print UUID' \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_APP=$(
            /usr/libexec/PlistBuddy \
              -c 'Print Entitlements:application-identifier' \
              "$RUNNER_TEMP/profile.plist"
          )

          test "$PROFILE_APP" = "$APP_TEAM.$APP_ID"

          mkdir -p \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          echo "APPLE SIGNING CREDENTIALS READY"

      # 5. Configure signing ONLY for Runner
      - name: Configure Runner-only signing
        shell: bash
        run: |
          set -euo pipefail

          if ! ruby -e 'require "xcodeproj"' >/dev/null 2>&1; then
            gem install --user-install xcodeproj --no-document
          fi

          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'ios/Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)

          target = project.targets.find do |item|
            item.name == 'Runner'
          end

          abort 'Runner target not found' unless target

          config = target.build_configurations.find do |item|
            item.name == 'Release'
          end

          abort 'Release configuration not found' unless config

          settings = config.build_settings

          settings['CODE_SIGN_STYLE'] = 'Manual'
          settings['DEVELOPMENT_TEAM'] = ENV.fetch('APP_TEAM')

          settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] =
            'Apple Distribution'

          settings['PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]'] =
            ENV.fetch('PROFILE_UUID')

          attrs = project.root_object.attributes
          attrs['TargetAttributes'] ||= {}
          attrs['TargetAttributes'][target.uuid] ||= {}

          attrs['TargetAttributes'][target.uuid]['ProvisioningStyle'] =
            'Manual'

          project.save

          puts 'RUNNER ONLY SIGNING CONFIGURED'
          RUBY

      # 6. Archive signed application
      - name: Archive signed iOS app
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SurveyDV.xcarchive" \
            archive

          APP="$RUNNER_TEMP/SurveyDV.xcarchive/Products/Applications/Runner.app"

          test -d "$APP"

          codesign --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"

          ACTUAL_ID=$(
            /usr/libexec/PlistBuddy \
              -c 'Print CFBundleIdentifier' \
              "$APP/Info.plist"
          )

          test "$ACTUAL_ID" = "$APP_ID"

          ACTUAL_VERSION=$(
            /usr/libexec/PlistBuddy \
              -c 'Print CFBundleShortVersionString' \
              "$APP/Info.plist"
          )

          ACTUAL_BUILD=$(
            /usr/libexec/PlistBuddy \
              -c 'Print CFBundleVersion' \
              "$APP/Info.plist"
          )

          test "$ACTUAL_VERSION" = "1.2.0"
          test "$ACTUAL_BUILD" = "2"

          echo "SIGNED IOS ARCHIVE SUCCESS"

      # 7. Export signed IPA
      - name: Export signed IPA
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import plistlib

          settings = {
              "method": "app-store-connect",
              "teamID": os.environ["APP_TEAM"],
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "manageAppVersionAndBuildNumber": False,
              "provisioningProfiles": {
                  os.environ["APP_ID"]:
                      os.environ["PROFILE_UUID"]
              }
          }

          path = os.path.join(
              os.environ["RUNNER_TEMP"],
              "ExportOptions.plist"
          )

          with open(path, "wb") as f:
              plistlib.dump(settings, f)

          print("ExportOptions.plist created")
          PY

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SurveyDV.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/SurveyDV-export"

          find "$RUNNER_TEMP/SurveyDV-export" \
            -name "*.ipa" -type f

          echo "SIGNED IPA EXPORT SUCCESS"

      # The account's Actions artifact storage is full. A draft release keeps
      # the signed package downloadable without publishing a release.
      - name: Save IPA as an unpublished draft asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IPA=$(find "$RUNNER_TEMP/SurveyDV-export" -name '*.ipa' -type f -print -quit)
          test -n "$IPA"
          PACKAGE="$RUNNER_TEMP/SurveyCalculatorDV-1.2.0-build2-AppStore.ipa"
          cp "$IPA" "$PACKAGE"
          gh release create "survey-dv-1.2.0-build2-$GITHUB_RUN_ID" "$PACKAGE" \
            --repo "$GITHUB_REPOSITORY" --target build/survey-dv-1.2.0-map \
            --draft --title 'Survey DV 1.2.0 build 2 — package delivery' \
            --notes 'Unpublished package delivery only. Survey source eaf40ef7774ba93029fc1465e680f7db74fd58b6. No App Store or TestFlight upload.'

      # 10. Remove temporary credentials
      - name: Cleanup signing credentials
        if: always()
        shell: bash
        run: |
          security delete-keychain \
            "$RUNNER_TEMP/signing.keychain-db" || true

          rm -f \
            "$RUNNER_TEMP/sign.p12" \
            "$RUNNER_TEMP/profile.mobileprovision" \
            "$RUNNER_TEMP/profile.plist" \
            "$RUNNER_TEMP/ExportOptions.plist"

          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f \
              "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi

          rm -f \
            "$HOME/.appstoreconnect/private_keys/"AuthKey_*.p8

          echo "SIGNING CREDENTIALS CLEANED"
