name: Survey DV keyless map image validation
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Reserved; validation never uploads to stores
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  validate:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          repository: datnguyenvip/survey-calculator-dv
          ref: 377a4475e1b58ecd4ade1cf40d8789558d030dc9
          token: ${{ secrets.SURVEY_DV_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Configure isolated simulator app
        run: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          flutter create --platforms=ios --org com.datnguyenvip.development .
          python3 ci/configure_features.py
          flutter pub get
      - name: Verify actual map images and native fixtures
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if "iPhone" in d["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/calculator_test.dart -d "$DEVICE"
          xcrun simctl shutdown "$DEVICE"
      - name: Save unpublished image evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -d build/native_ui ]; then exit 0; fi
          gh release create "survey-dv-map-network-$GITHUB_RUN_ID" build/native_ui/*.png --repo "$GITHUB_REPOSITORY" --target validate/survey-dv-map-tiles --draft --title 'Survey DV native map image checks' --notes 'Unpublished simulator screenshots. Production application code unchanged from eaf40ef; only test capture readiness was changed. No signing or store upload.'
