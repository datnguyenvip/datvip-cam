
name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ipa.yml"

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' DatvipCam.xcodeproj/project.pbxproj
          grep 'objectVersion =' DatvipCam.xcodeproj/project.pbxproj

      - name: Build unsigned IPA
        working-directory: ios
        run: |
          xcodebuild \
            -project DatvipCam.xcodeproj \
            -scheme DatvipCam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DatvipCam.app Payload/
          zip -qry DatvipCam-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DatvipCam-unsigned-ipa
          path: ios/DatvipCam-unsigned.ipa
          if-no-files-found: error
