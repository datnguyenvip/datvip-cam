
name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      screenshots_only:
        description: Recheck UI evidence after test-only changes (full validation is the default)
        type: boolean
        default: false
      appstore:
        description: Also build an App Store signed archive after tests pass
        type: boolean
        default: false
      upload:
        description: Upload the signed archive to App Store Connect
        type: boolean
        default: false
  push:
    branches: [main, codex/datvip-cam-verified-integration]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ipa.yml"

jobs:
  appstore:
    if: github.event_name == 'workflow_dispatch' && inputs.appstore
    needs: build
    uses: ./.github/workflows/ios-appstore.yml
    with:
      upload: ${{ inputs.upload }}
    secrets: inherit
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check interface translations
        run: python3 scripts/check-localization.py

      - name: Select Xcode
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' DatvipCam.xcodeproj/project.pbxproj
          grep 'objectVersion =' DatvipCam.xcodeproj/project.pbxproj

      - name: Build unsigned IPA
        working-directory: ios
        run: |
          xcodebuild \
            -project DatvipCam.xcodeproj \
            -scheme DatvipCam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DatvipCam.app Payload/
          zip -qry DatvipCam-unsigned.ipa Payload

      - name: Boot iPhone Simulator
        working-directory: ios
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); a=[x for devices in d["devices"].values() for x in devices if "iPhone" in x["name"]]; print(next((x["udid"] for x in a if "Pro Max" in x["name"]),a[0]["udid"]))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Test stamp content and rendered layout on iOS Simulator
        if: inputs.screenshots_only != true
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project DatvipCam.xcodeproj \
            -scheme StampTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath StampTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test | tee StampTests.log

      - name: Capture actual Vietnamese and English settings on iPhone Simulator
        if: always() && env.DEVICE_ID != ''
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project DatvipCam.xcodeproj -scheme StoreScreenshots -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 300 -maximum-test-execution-time-allowance 360 \
            -resultBundlePath StoreScreenshots.xcresult CODE_SIGNING_ALLOWED=NO test | tee StoreScreenshots.log

      - name: Export layout images
        if: always()
        working-directory: ios
        run: |
          if [ -d StampTests.xcresult ]; then
            xcrun xcresulttool export attachments --path StampTests.xcresult --output-path StampTestImages
          fi
          if [ -d StoreScreenshots.xcresult ]; then
            xcrun xcresulttool export attachments --path StoreScreenshots.xcresult --output-path StoreScreenImages
          fi

      - name: Upload stamp test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StampTests-evidence
          path: |
            ios/StampTests.xcresult
            ios/StampTests.log
            ios/StampTestImages
            ios/StoreScreenshots.log
            ios/StoreScreenImages

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DatvipCam-unsigned-ipa
          path: ios/DatvipCam-unsigned.ipa
          if-no-files-found: error
