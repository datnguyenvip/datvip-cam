
name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, codex/datvip-cam-verified-integration]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ipa.yml"

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' DatvipCam.xcodeproj/project.pbxproj
          grep 'objectVersion =' DatvipCam.xcodeproj/project.pbxproj

      - name: Build unsigned IPA
        working-directory: ios
        run: |
          xcodebuild \
            -project DatvipCam.xcodeproj \
            -scheme DatvipCam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DatvipCam.app Payload/
          zip -qry DatvipCam-unsigned.ipa Payload

      - name: Test stamp content and rendered layout on iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if "iPhone" in x["name"]))')
          xcodebuild \
            -project DatvipCam.xcodeproj \
            -scheme StampTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath StampTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test | tee StampTests.log

      - name: Export layout images
        if: always()
        working-directory: ios
        run: |
          if [ -d StampTests.xcresult ]; then
            xcrun xcresulttool export attachments --path StampTests.xcresult --output-path StampTestImages
          fi

      - name: Upload stamp test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StampTests-evidence
          path: |
            ios/StampTests.xcresult
            ios/StampTests.log
            ios/StampTestImages

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DatvipCam-unsigned-ipa
          path: ios/DatvipCam-unsigned.ipa
          if-no-files-found: error
