name: Build signed iOS App Store archive
on:
  workflow_call:
    inputs:
      upload:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      existing_run_id:
        description: Reuse the signed IPA artifact from this successful workflow run
        type: string
        default: ''
      upload:
        description: Upload the verified build to App Store Connect
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  upload-existing:
    if: github.event_name == 'workflow_dispatch' && inputs.upload && inputs.existing_run_id != ''
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CameraHT-AppStore-signed
          run-id: ${{ inputs.existing_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: signed-input
      - name: Verify the original signed release IPA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, plistlib, zipfile
          ipa=pathlib.Path('signed-input/DatvipCam.ipa')
          assert hashlib.sha256(ipa.read_bytes()).hexdigest() == '93056439ef2f835a382e3be66767d1730915bb40f15cd46c3af0816b3350150c'
          with zipfile.ZipFile(ipa) as z:
              assert z.testzip() is None
              info=plistlib.loads(z.read('Payload/DatvipCam.app/Info.plist'))
              assert info['CFBundleIdentifier']=='com.datvip.cam'
              assert info['CFBundleShortVersionString']=='1.2.0'
              assert info['CFBundleVersion']=='172'
              z.extractall('signed-check')
          print('Verified original Camera HT 1.2.0 (172) IPA checksum and identity.')
          PY
          codesign --verify --deep --strict signed-check/Payload/DatvipCam.app
      - name: Prepare API client
        run: |
          python3 -m venv "$RUNNER_TEMP/asc-client"
          "$RUNNER_TEMP/asc-client/bin/pip" install --quiet cryptography
      - name: Check whether Apple already has this build
        id: before
        run: |
          "$RUNNER_TEMP/asc-client/bin/python" scripts/check-asc-build.py --output before.json
          python3 - <<'PY'
          import json,os
          data=json.load(open('before.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('exists='+str(bool(data['build'])).lower()+'\n')
          PY
      - name: Upload the verified existing IPA
        if: steps.before.outputs.exists != 'true'
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app --type ios --file signed-input/DatvipCam.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Wait for Apple processing
        run: |
          "$RUNNER_TEMP/asc-client/bin/python" scripts/check-asc-build.py --wait --output apple-build-status.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CameraHT-AppStore-upload-status
          path: |
            before.json
            apple-build-status.json
      - name: Remove API private key
        if: always()
        run: rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
  appstore:
    if: inputs.existing_run_id == '' || inputs.existing_run_id == null
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Prepare signing credentials in temporary keychain
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          set -euo pipefail
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/AuthKey.p8"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security import "$RUNNER_TEMP/distribution.p12" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$RUNNER_TEMP/signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/signing.keychain-db" login.keychain-db
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version
      - name: Archive and verify signed app
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild -project DatvipCam.xcodeproj -scheme DatvipCam -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/CameraHT.xcarchive" \
            DEVELOPMENT_TEAM=FXQ7QLZ2HS CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" CURRENT_PROJECT_VERSION=172 archive
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/CameraHT.xcarchive/Products/Applications/DatvipCam.app"
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$RUNNER_TEMP/CameraHT.xcarchive/Products/Applications/DatvipCam.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print DTSDKName' "$RUNNER_TEMP/CameraHT.xcarchive/Products/Applications/DatvipCam.app/Info.plist"
          APP_INFO="$RUNNER_TEMP/CameraHT.xcarchive/Products/Applications/DatvipCam.app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP_INFO")" = '1.2.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP_INFO")" = '172'
      - name: Export App Store IPA
        run: |
          python3 - <<'PY'
          import os, plistlib
          settings = {'method':'app-store-connect','teamID':'FXQ7QLZ2HS','signingStyle':'manual',
            'signingCertificate':'Apple Distribution','manageAppVersionAndBuildNumber':False,
            'provisioningProfiles':{'com.datvip.cam':os.environ['PROFILE_UUID']}}
          with open(os.environ['RUNNER_TEMP']+'/ExportOptions.plist','wb') as file: plistlib.dump(settings,file)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/CameraHT.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/CameraHT-export"
      - name: Upload to App Store Connect
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$RUNNER_TEMP/AuthKey.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/CameraHT-export/DatvipCam.ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: CameraHT-AppStore-signed
          path: ${{ runner.temp }}/CameraHT-export/*.ipa
          if-no-files-found: error
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/AuthKey.p8"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          rm -f "$HOME/.appstoreconnect/private_keys/"AuthKey_*.p8
