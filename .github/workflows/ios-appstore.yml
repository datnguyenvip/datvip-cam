name: Build signed iOS App Store archive
on:
  workflow_call:
    inputs:
      upload:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the verified build to App Store Connect
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  appstore:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Prepare signing credentials in temporary keychain
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          set -euo pipefail
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/AuthKey.p8"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security import "$RUNNER_TEMP/distribution.p12" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$RUNNER_TEMP/signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/signing.keychain-db" login.keychain-db
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version
      - name: Archive and verify signed app
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild -project DatvipCam.xcodeproj -scheme DatvipCam -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/CameraHT.xcarchive" \
            DEVELOPMENT_TEAM=FXQ7QLZ2HS CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" CURRENT_PROJECT_VERSION="$((100 + GITHUB_RUN_NUMBER))" archive
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/CameraHT.xcarchive/Products/Applications/DatvipCam.app"
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$RUNNER_TEMP/CameraHT.xcarchive/Products/Applications/DatvipCam.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print DTSDKName' "$RUNNER_TEMP/CameraHT.xcarchive/Products/Applications/DatvipCam.app/Info.plist"
      - name: Export App Store IPA
        run: |
          python3 - <<'PY'
          import os, plistlib
          settings = {'method':'app-store-connect','teamID':'FXQ7QLZ2HS','signingStyle':'manual',
            'signingCertificate':'Apple Distribution','manageAppVersionAndBuildNumber':False,
            'provisioningProfiles':{'com.datvip.cam':os.environ['PROFILE_UUID']}}
          with open(os.environ['RUNNER_TEMP']+'/ExportOptions.plist','wb') as file: plistlib.dump(settings,file)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/CameraHT.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/CameraHT-export"
      - name: Upload to App Store Connect
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$RUNNER_TEMP/AuthKey.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/CameraHT-export/DatvipCam.ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: CameraHT-AppStore-signed
          path: ${{ runner.temp }}/CameraHT-export/*.ipa
          if-no-files-found: error
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/AuthKey.p8"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          rm -f "$HOME/.appstoreconnect/private_keys/"AuthKey_*.p8
