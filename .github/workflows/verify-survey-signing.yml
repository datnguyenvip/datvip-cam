
name: Verify Survey DV Apple Signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15-intel
    steps:
      - name: Compare Apple signing certificates
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.SURVEY_DV_IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          : "${P12_BASE64:?Missing P12}"
          : "${P12_PASSWORD:?Missing password}"
          : "${PROFILE_BASE64:?Missing profile}"

          trap 'rm -f "$RUNNER_TEMP/sign.p12" "$RUNNER_TEMP/signing.pem" "$RUNNER_TEMP/signing.der" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"' EXIT

          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"

          openssl pkcs12 -in "$RUNNER_TEMP/sign.p12" \
            -passin env:P12_PASSWORD \
            -clcerts -nokeys \
            -out "$RUNNER_TEMP/signing.pem"

          openssl x509 -in "$RUNNER_TEMP/signing.pem" \
            -outform DER -out "$RUNNER_TEMP/signing.der"

          python3 - <<'PY'
          import hashlib
          import os
          import plistlib
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          with (temp / "profile.plist").open("rb") as f:
              profile = plistlib.load(f)

          expected_id = "FXQ7QLZ2HS.com.datnguyenvip.surveycalculatordv"
          actual_id = profile["Entitlements"]["application-identifier"]

          if actual_id != expected_id:
              raise SystemExit("PROFILE_BUNDLE_ID_MISMATCH")

          actual = hashlib.sha256(
              (temp / "signing.der").read_bytes()
          ).digest()

          matches = any(
              hashlib.sha256(cert).digest() == actual
              for cert in profile["DeveloperCertificates"]
          )

          if not matches:
              raise SystemExit("CERTIFICATE_MISMATCH")

          print("CERTIFICATE_MATCH - PROFILE_V2_OK")
          PY
