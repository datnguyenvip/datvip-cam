name: DatvipCam
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.12.0
  GoogleUMP:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: 3.1.0
options:
  bundleIdPrefix: com.datvip
  objectVersion: 56
  deploymentTarget:
    iOS: "16.0"
targets:
  DatvipCam:
    type: application
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUMP
        product: GoogleUserMessagingPlatform
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datvip.cam
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Field Camera
        GADApplicationIdentifier: ca-app-pub-7989207995898060~8435659601
        GADDelayAppMeasurementInit: true
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, vi]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Datvip Cam cần camera để chụp ảnh.
        NSLocationWhenInUseUsageDescription: Datvip Cam cần vị trí để đóng dấu toạ độ lên ảnh.
        NSMicrophoneUsageDescription: Datvip Cam cần micro để ghi âm khi quay video.
        NSPhotoLibraryAddUsageDescription: Datvip Cam cần quyền lưu ảnh vào thư viện.

  StampTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - ContentView.swift
          - DatvipCamApp.swift
          - ExportGallery.swift
          - AdFreeStore.swift
          - CameraBanner.swift
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datvip.cam.stamptests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  StampTests:
    build:
      targets:
        StampTests: all
    test:
      targets:
        - StampTests
      gatherCoverageData: false
