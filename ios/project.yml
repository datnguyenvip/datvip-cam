name: DatvipCam
options:
  bundleIdPrefix: com.datvip
  objectVersion: 56
  deploymentTarget:
    iOS: "16.0"
targets:
  DatvipCam:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: [CameraBanner.swift, AdFreeStore.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datvip.cam
        MARKETING_VERSION: "1.1.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Camera HT
        ITSAppUsesNonExemptEncryption: false
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, vi]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Datvip Cam cần camera để chụp ảnh.
        NSMotionUsageDescription: Camera HT dùng cảm biến trọng lực để hiển thị thước cân bằng.
        NSLocationWhenInUseUsageDescription: Datvip Cam cần vị trí để đóng dấu toạ độ lên ảnh.
        NSMicrophoneUsageDescription: Datvip Cam cần micro để ghi âm khi quay video.
        NSPhotoLibraryAddUsageDescription: Datvip Cam cần quyền lưu ảnh vào thư viện.
        NSPhotoLibraryUsageDescription: Camera HT can check whether photos and videos saved by this app are still available in Photos.

  StampTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - ContentView.swift
          - DatvipCamApp.swift
          - ExportGallery.swift
          - CameraBanner.swift
          - AdFreeStore.swift
      - path: Tests
        excludes: [AdFreeStoreTests.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datvip.cam.stamptests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
  StoreScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: DatvipCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datvip.cam.screenshots
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DatvipCam
        SWIFT_VERSION: "5.0"
schemes:
  DatvipCam:
    build:
      targets:
        DatvipCam: all
    run:
      config: Debug
    archive:
      config: Release
  StoreScreenshots:
    build:
      targets:
        DatvipCam: all
        StoreScreenshots: [test]
    test:
      targets: [StoreScreenshots]
  StampTests:
    build:
      targets:
        StampTests: all
    test:
      targets:
        - StampTests
      gatherCoverageData: false
